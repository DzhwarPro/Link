<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#050505;min-height:100vh;font-family:'Tajawal',sans-serif;overflow-x:hidden}
.gradient-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;background:linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#1a1a2e);background-size:400% 400%;animation:g 15s ease infinite}
@keyframes g{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.main-wrapper{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:420px;text-align:center;padding:40px 25px}
h1{font-size:42px;font-weight:900;margin-bottom:10px;background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#ff9ff3,#54a0ff,#5f27cd,#ff6b6b);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:n 4s ease infinite,f 3s ease-in-out infinite}
@keyframes n{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.subtitle{color:rgba(255,255,255,0.5);font-size:14px;letter-spacing:2px;margin-bottom:40px}
.social-links{display:flex;flex-direction:column;gap:16px}
.social-btn{display:flex;align-items:center;justify-content:center;gap:12px;padding:18px 25px;border-radius:16px;text-decoration:none;color:#fff;font-weight:700;font-size:16px;transition:all 0.4s ease;background:linear-gradient(#0a0a0a,#0a0a0a) padding-box,linear-gradient(135deg,var(--c1),var(--c2)) border-box;border:2px solid transparent}
.social-btn:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 10px 40px rgba(255,255,255,0.1)}
i{font-size:20px;width:26px;text-align:center}
.footer-line{margin-top:40px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent)}
.footer-text{color:rgba(255,255,255,0.3);font-size:11px;margin-top:15px;letter-spacing:2px}
.loading,.error{text-align:center;font-size:18px;margin-top:50px}
.loading{color:#d4af37}
.error{color:#ff4444}
</style>
</head>
<body>
<div class="gradient-bg"></div>
<div class="main-wrapper">
<div class="container">
<div id="content"><div class="loading">⏳ بارکردن...</div></div>
<div class="footer-line"></div>
<div class="footer-text">KURD.SYSTEM © 2026</div>
</div>
</div>
<script>
const JSONBIN_ID = "BIN_ID_لێرە";
const JSONBIN_API_KEY = "$2a$10$KEY_لێرە";

function getUsername(){
  const p = window.location.search;
  const params = new URLSearchParams(p);
  return params.get('u') || 'default';
}

async function load(){
  const username = getUsername();
  const c = document.getElementById('content');
  try{
    const r = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}/latest`,{headers:{"X-Master-Key":JSONBIN_API_KEY}});
    const j = await r.json();
    const d = j.record;
    if(!d || !d[username]){
      c.innerHTML='<div class="error">❌ بەکارهێنەر نەدۆزرایەوە</div>';
      document.title='Not Found';
      return;
    }
    const u = d[username];
    document.title = (u.name||username)+' - Kurd.System';
    let btns='';
    if(u.buttons){
      u.buttons.forEach(b=>{
        btns+=`<a href="${b.url}" target="_blank" class="social-btn" style="--c1:${b.color};--c2:${b.color}"><i class="${b.icon}" style="color:${b.color}"></i> ${b.name}</a>`;
      });
    }
    c.innerHTML=`<h1>${u.name||username}</h1><div class="subtitle">${u.bio||''}</div><div class="social-links">${btns}</div>`;
  }catch(e){
    c.innerHTML='<div class="error">❌ هەڵە</div>';
  }
}
load();
</script>
</body>
</html>
