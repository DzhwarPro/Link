<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Kurd.System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#050505;min-height:100vh;padding:30px 20px;font-family:'Tajawal',sans-serif;color:#fff}
        .admin-container{max-width:600px;margin:0 auto}
        h1{color:#d4af37;font-size:28px;text-align:center;margin-bottom:30px}
        .section{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:25px;margin-bottom:20px}
        .section h2{color:#d4af37;font-size:18px;margin-bottom:15px}
        .field{margin-bottom:15px}
        .field label{color:#aaa;display:block;margin-bottom:5px;font-size:14px}
        .field input{width:100%;padding:12px 15px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#fff;font-family:'Tajawal';font-size:14px;outline:none}
        .field input:focus{border-color:#d4af37}
        .btn{padding:15px;border:none;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;font-family:'Tajawal';width:100%;transition:all 0.3s}
        .btn-save{background:#d4af37;color:#000;margin-top:10px}
        .btn-save:hover{background:#b8962e}
        .btn-add{background:rgba(212,175,55,0.2);color:#d4af37;border:1px solid rgba(212,175,55,0.4);margin-bottom:15px}
        .btn-add:hover{background:rgba(212,175,55,0.3)}
        .user-list{max-height:300px;overflow-y:auto;border:1px solid rgba(255,255,255,0.08);border-radius:12px;margin-bottom:15px}
        .user-item{padding:12px 15px;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all 0.2s}
        .user-item:hover{background:rgba(212,175,55,0.1)}
        .user-item.active{background:rgba(212,175,55,0.2);border-right:3px solid #d4af37}
        .user-item span{color:#ccc}
        .user-item.active span{color:#d4af37}
        .del-btn{background:none;border:none;color:#ff4444;cursor:pointer;font-size:18px;padding:5px 10px;border-radius:8px;transition:all 0.2s}
        .del-btn:hover{background:rgba(255,68,68,0.1)}
        .toast{position:fixed;top:20px;right:50%;transform:translateX(50%);background:#d4af37;color:#000;padding:12px 30px;border-radius:50px;font-weight:700;z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none}
        .toast.show{opacity:1}
        .counter{text-align:center;color:#666;font-size:13px;margin-bottom:20px}
        .login-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#050505;z-index:500;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:15px}
        .login-overlay.hidden{display:none}
        .login-overlay input{padding:15px 20px;border-radius:12px;border:1px solid rgba(212,175,55,0.4);background:rgba(255,255,255,0.05);color:#fff;font-family:'Tajawal';font-size:16px;outline:none;width:280px;text-align:center}
        .login-overlay button{padding:15px 40px;border:none;border-radius:12px;background:#d4af37;color:#000;font-weight:900;font-size:16px;cursor:pointer;font-family:'Tajawal'}
    </style>
</head>
<body>
    <!-- پاراستن بە وشەی نهێنی -->
    <div class="login-overlay" id="loginOverlay">
        <h1 style="color:#d4af37;margin-bottom:10px">🔒 چوونەژوورەوە</h1>
        <input type="password" id="loginPass" placeholder="وشەی نهێنی بنووسە">
        <button onclick="checkLogin()">چوونەژوورەوە</button>
    </div>

    <div class="toast" id="toast"></div>

    <div class="admin-container" id="adminContent" style="display:none">
        <h1>⚙️ پانێڵی بەڕێوەبردن</h1>
        <div class="counter" id="userCounter"></div>

        <!-- لیستی بەکارهێنەران -->
        <div class="section">
            <h2>📋 بەکارهێنەران</h2>
            <div class="user-list" id="userList"></div>
            <button class="btn btn-add" onclick="newUser()">➕ بەکارهێنەری نوێ</button>
        </div>

        <!-- فۆڕمی دەستکاری -->
        <div class="section" id="editSection" style="display:none">
            <h2 id="editTitle">✏️ دەستکاری</h2>
            <div class="field"><label>ناوی بەکارهێنەر (ID)</label><input type="text" id="fUser" placeholder="navi_user"></div>
            <div class="field"><label>ناوی پیشاندان</label><input type="text" id="fName"></div>
            <div class="field"><label>وەسف / بایۆ</label><input type="text" id="fBio"></div>
            <div class="field"><label><i class="fab fa-facebook-f"></i> فەیسبووک</label><input type="url" id="fFacebook"></div>
            <div class="field"><label><i class="fab fa-snapchat-ghost"></i> سناپچات</label><input type="url" id="fSnapchat"></div>
            <div class="field"><label><i class="fab fa-instagram"></i> ئینستاگرام</label><input type="url" id="fInstagram"></div>
            <div class="field"><label><i class="fab fa-tiktok"></i> تیکتۆک</label><input type="url" id="fTiktok"></div>
            <div class="field"><label><i class="fab fa-telegram-plane"></i> تلێگرام</label><input type="url" id="fTelegram"></div>
            <div class="field"><label><i class="fab fa-whatsapp"></i> واتسئەپ</label><input type="url" id="fWhatsapp"></div>
            <button class="btn btn-save" onclick="saveUser()">💾 پاشەکەوتکردن</button>
        </div>
    </div>

    <script>
        // ===== ڕێکخستنەکان =====
        const JSONBIN_ID = "BIN_ID_لێرە_دابنێ";
        const JSONBIN_API_KEY = "$2a$10$KEY_لێرە_دابنێ";
        const ADMIN_PASSWORD = "kurd2026"; // وشەی نهێنی بگۆڕە!
        // ========================

        let allData = {};
        let editingUser = null;

        function checkLogin() {
            const pass = document.getElementById("loginPass").value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById("loginOverlay").classList.add("hidden");
                document.getElementById("adminContent").style.display = "block";
                loadData();
            } else {
                showToast("❌ وشەی نهێنی هەڵەیە!");
            }
        }

        async function loadData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}/latest`, {
                    headers: {"X-Master-Key": JSONBIN_API_KEY}
                });
                const json = await res.json();
                allData = json.record;
                renderUserList();
            } catch(e) {
                showToast("❌ هەڵە لە بارکردن!");
            }
        }

        async function saveToServer() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}`, {
                    method: "PUT",
                    headers: {"Content-Type":"application/json","X-Master-Key":JSONBIN_API_KEY},
                    body: JSON.stringify(allData)
                });
                return true;
            } catch(e) { return false; }
        }

        function renderUserList() {
            const list = document.getElementById("userList");
            const users = Object.keys(allData);
            document.getElementById("userCounter").textContent = `📊 کۆی بەکارهێنەران: ${users.length}`;
            list.innerHTML = "";
            users.forEach(u => {
                const div = document.createElement("div");
                div.className = "user-item" + (editingUser === u ? " active" : "");
                div.innerHTML = `<span>${u === "default" ? "🌐 سەرەکی" : "👤 " + u}</span>`;
                if (u !== "default") {
                    const del = document.createElement("button");
                    del.className = "del-btn";
                    del.innerHTML = "🗑️";
                    del.onclick = (e) => { e.stopPropagation(); deleteUser(u); };
                    div.appendChild(del);
                }
                div.onclick = () => editUser(u);
                list.appendChild(div);
            });
        }

        function newUser() {
            editingUser = "__new__";
            document.getElementById("editSection").style.display = "block";
            document.getElementById("editTitle").textContent = "➕ بەکارهێنەری نوێ";
            document.getElementById("fUser").value = "";
            document.getElementById("fUser").disabled = false;
            ["fName","fBio","fFacebook","fSnapchat","fInstagram","fTiktok","fTelegram","fWhatsapp"].forEach(id => document.getElementById(id).value = "");
            renderUserList();
        }

        function editUser(user) {
            editingUser = user;
            const data = allData[user] || {};
            document.getElementById("editSection").style.display = "block";
            document.getElementById("editTitle").textContent = user === "default" ? "✏️ دەستکاری سەرەکی" : `✏️ دەستکاری: ${user}`;
            document.getElementById("fUser").value = user === "default" ? "" : user;
            document.getElementById("fUser").disabled = user === "default";
            document.getElementById("fName").value = data.name || "";
            document.getElementById("fBio").value = data.bio || "";
            document.getElementById("fFacebook").value = data.facebook || "";
            document.getElementById("fSnapchat").value = data.snapchat || "";
            document.getElementById("fInstagram").value = data.instagram || "";
            document.getElementById("fTiktok").value = data.tiktok || "";
            document.getElementById("fTelegram").value = data.telegram || "";
            document.getElementById("fWhatsapp").value = data.whatsapp || "";
            renderUserList();
        }

        async function saveUser() {
            let user = document.getElementById("fUser").value.trim();
            if (!user && editingUser === "__new__") { showToast("❌ ناوی بەکارهێنەر بنووسە!"); return; }
            if (!user) user = "default";

            allData[user] = {
                name: document.getElementById("fName").value,
                bio: document.getElementById("fBio").value,
                facebook: document.getElementById("fFacebook").value,
                snapchat: document.getElementById("fSnapchat").value,
                instagram: document.getElementById("fInstagram").value,
                tiktok: document.getElementById("fTiktok").value,
                telegram: document.getElementById("fTelegram").value,
                whatsapp: document.getElementById("fWhatsapp").value
            };

            const ok = await saveToServer();
            if (ok) {
                editingUser = user;
                renderUserList();
                showToast("✅ پاشەکەوت کرا!");
            } else {
                showToast("❌ هەڵە لە پاشەکەوت!");
            }
        }

        async function deleteUser(user) {
            if (!confirm(`دڵنیایت لە سڕینەوەی "${user}"؟`)) return;
            delete allData[user];
            const ok = await saveToServer();
            if (ok) {
                editingUser = null;
                document.getElementById("editSection").style.display = "none";
                renderUserList();
                showToast("🗑️ سڕایەوە!");
            }
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg; t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 2500);
        }

        // Enter بۆ چوونەژوورەوە
        document.getElementById("loginPass").addEventListener("keypress", (e) => {
            if (e.key === "Enter") checkLogin();
        });
    </script>
</body>
</html>
