<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurd.System - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #050505;
            min-height: 100vh;
            font-family: 'Tajawal', sans-serif;
            color: #fff;
        }

        .gradient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50% }
            50% { background-position: 100% 50% }
            100% { background-position: 0% 50% }
        }

        .wrapper {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.5);
            margin-bottom: 40px;
            font-size: 14px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .card h2 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #feca57;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.8);
            font-weight: 700;
        }

        input, select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.4);
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            font-size: 15px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #48dbfb;
            box-shadow: 0 0 0 3px rgba(72, 219, 251, 0.2);
        }

        select option {
            background: #1a1a2e;
            color: #fff;
        }

        .btn {
            display: inline-block;
            padding: 14px 30px;
            border-radius: 12px;
            border: none;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #48dbfb, #1877F2);
            color: #fff;
        }

        .btn-success {
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: #fff;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            color: #fff;
            padding: 8px 16px;
            font-size: 13px;
            width: auto;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .link-item i {
            font-size: 24px;
            width: 40px;
            text-align: center;
        }

        .link-info {
            flex: 1;
        }

        .link-info .name {
            font-weight: 700;
            font-size: 16px;
        }

        .link-info .url {
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            margin-top: 4px;
            word-break: break-all;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #48dbfb;
            text-decoration: none;
            font-weight: 700;
        }

        .alert {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: rgba(37, 211, 102, 0.2);
            border: 1px solid #25D366;
            color: #25D366;
        }

        .alert-error {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
        }

        .icon-preview {
            display: inline-block;
            font-size: 24px;
            margin-right: 10px;
            vertical-align: middle;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.4);
        }

        /* Login Section */
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            text-align: center;
        }

        .login-icon {
            font-size: 80px;
            color: #48dbfb;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>

    <div class="wrapper">
        <div class="container">
            <a href="index.html" class="back-link"><i class="fas fa-arrow-right"></i> گەڕانەوە بۆ ماڵپەڕ</a>
            
            <!-- بەشی چوونەژوورەوە -->
            <div id="loginSection">
                <div class="login-container">
                    <div class="login-icon"><i class="fas fa-shield-alt"></i></div>
                    <h1>چوونەژوورەوە</h1>
                    <p class="subtitle">تکایە وشەی نهێنی بنووسە بۆ چوونە ژوورەوە بۆ پانێڵی بەڕێوەبەر</p>
                    
                    <div class="card">
                        <div id="loginAlert" class="alert alert-error"></div>
                        <form id="loginForm">
                            <div class="form-group">
                                <label><i class="fas fa-lock"></i> وشەی نهێنی</label>
                                <input type="password" id="password" placeholder="وشەی نهێنی..." required>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-sign-in-alt"></i> چوونەژوورەوە
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- بەشی پانێڵ -->
            <div id="adminPanel" class="hidden">
                <h1>پانێڵی بەڕێوەبەر</h1>
                <p class="subtitle">بەڕێوەبردنی ماڵپەڕەکەت</p>

                <div id="alert" class="alert alert-success"></div>

                <!-- ڕێکخستنەکان -->
                <div class="card">
                    <h2><i class="fas fa-cog"></i> ڕێکخستنە گشتییەکان</h2>
                    <form id="settingsForm">
                        <div class="form-group">
                            <label>ناوی سیستەم (لە سەرووی پەڕە)</label>
                            <input type="text" id="systemName" placeholder="وەک: Kurd.System" required>
                        </div>

                        <div class="form-group">
                            <label>ناونیشانی ژێرەوە</label>
                            <input type="text" id="systemSubtitle" placeholder="وەک: پەیوەندیم پێوە بکە" required>
                        </div>

                        <div class="form-group">
                            <label>ناونیشانی فووتەر</label>
                            <input type="text" id="footerText" placeholder="وەک: KURD.SYSTEM © 2026">
                        </div>

                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save"></i> هەڵگرتنی ڕێکخستنەکان
                        </button>
                    </form>
                </div>

                <!-- فۆرمی زیادکردنی لینک -->
                <div class="card">
                    <h2><i class="fas fa-plus-circle"></i> زیادکردنی لینکی نوێ</h2>
                    <form id="addLinkForm">
                        <div class="form-group">
                            <label>ناوی پلاتفۆرم</label>
                            <input type="text" id="linkName" placeholder="وەک: یوتیوب، تویتەر..." required>
                        </div>

                        <div class="form-group">
                            <label>لینک</label>
                            <input type="url" id="linkUrl" placeholder="https://..." required>
                        </div>

                        <div class="form-group">
                            <label>جۆری ئایکۆن</label>
                            <select id="linkIcon" required>
                                <option value="fa-facebook-f" data-color="#1877F2">فەیسبووک</option>
                                <option value="fa-instagram" data-color="#E4405F">ئینستاگرام</option>
                                <option value="fa-tiktok" data-color="#fff">تیکتۆک</option>
                                <option value="fa-youtube" data-color="#ff0000">یوتیوب</option>
                                <option value="fa-twitter" data-color="#1DA1F2">تویتەر</option>
                                <option value="fa-telegram-plane" data-color="#0088cc">تلێگرام</option>
                                <option value="fa-whatsapp" data-color="#25D366">واتسئەپ</option>
                                <option value="fa-snapchat-ghost" data-color="#FFFC00">سناپچات</option>
                                <option value="fa-linkedin-in" data-color="#0A66C2">لینکد ئین</option>
                                <option value="fa-discord" data-color="#5865F2">دیسکۆرد</option>
                                <option value="fa-twitch" data-color="#9146FF">تویچ</option>
                                <option value="fa-github" data-color="#fff">گیت هەب</option>
                                <option value="fa-snapchat" data-color="#FFFC00">سناپچات (2)</option>
                                <option value="fa-facebook-messenger" data-color="#0084FF">مەسنجەر</option>
                            </select>
                            <span id="iconPreview" class="icon-preview"></span>
                        </div>

                        <div class="form-group">
                            <label>ڕەنگی سەرەکی</label>
                            <input type="color" id="linkColor" value="#48dbfb" style="height: 50px; cursor: pointer;">
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-plus"></i> زیادکردن
                        </button>
                    </form>
                </div>

                <!-- لیستی لینکەکان -->
                <div class="card">
                    <h2><i class="fas fa-list"></i> لینکە زیادکراوەکان</h2>
                    <div id="linkList" class="link-list">
                        <div class="empty-state">
                            <i class="fas fa-inbox" style="font-size:48px; margin-bottom:15px; display:block;"></i>
                            هیچ لینکێک زیاد نەکراوە
                        </div>
                    </div>
                </div>

                <button onclick="logout()" class="btn btn-danger" style="margin-top: 20px;">
                    <i class="fas fa-sign-out-alt"></i> دەرچوون
                </button>
            </div>
        </div>
    </div>

    <script>
        const CORRECT_PASSWORD = 'Dzhwar1999$$$';
        const SESSION_KEY = 'adminLoggedIn';
        const SESSION_DURATION = 24 * 60 * 60 * 1000; // 24 hours

        const loginSection = document.getElementById('loginSection');
        const adminPanel = document.getElementById('adminPanel');
        const loginForm = document.getElementById('loginForm');
        const settingsForm = document.getElementById('settingsForm');
        const addLinkForm = document.getElementById('addLinkForm');
        const linkList = document.getElementById('linkList');
        const alertBox = document.getElementById('alert');
        const loginAlert = document.getElementById('loginAlert');
        const iconSelect = document.getElementById('linkIcon');
        const iconPreview = document.getElementById('iconPreview');

        // پشکنینی نیشانەی چوونەژوورەوە
        function checkSession() {
            const session = JSON.parse(localStorage.getItem(SESSION_KEY) || '{}');
            if (session.loggedIn && (Date.now() - session.time) < SESSION_DURATION) {
                loginSection.classList.add('hidden');
                adminPanel.classList.remove('hidden');
                loadSettings();
                loadLinks();
                return true;
            }
            return false;
        }

        // چوونەژوورەوە
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const pass = document.getElementById('password').value;
            
            if (pass === CORRECT_PASSWORD) {
                localStorage.setItem(SESSION_KEY, JSON.stringify({
                    loggedIn: true,
                    time: Date.now()
                }));
                loginSection.classList.add('hidden');
                adminPanel.classList.remove('hidden');
                loadSettings();
                loadLinks();
            } else {
                loginAlert.textContent = 'وشەی نهێنی هەڵەیە!';
                loginAlert.style.display = 'block';
                setTimeout(() => { loginAlert.style.display = 'none'; }, 3000);
            }
        });

        // دەرچوون
        function logout() {
            localStorage.removeItem(SESSION_KEY);
            location.reload();
        }

        // بارکردنی ڕێکخستنەکان
        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('siteSettings') || '{}');
            document.getElementById('systemName').value = settings.name || 'Kurd.System';
            document.getElementById('systemSubtitle').value = settings.subtitle || 'پەیوەندیم پێوە بکە';
            document.getElementById('footerText').value = settings.footer || 'KURD.SYSTEM © 2026';
        }

        // هەڵگرتنی ڕێکخستنەکان
        settingsForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const settings = {
                name: document.getElementById('systemName').value,
                subtitle: document.getElementById('systemSubtitle').value,
                footer: document.getElementById('footerText').value
            };
            localStorage.setItem('siteSettings', JSON.stringify(settings));
            showAlert('ڕێکخستنەکان بە سەرکەوتوویی هەڵگیران!');
        });

        // پیشاندانی ئایکۆن
        iconSelect.addEventListener('change', updateIconPreview);
        updateIconPreview();

        function updateIconPreview() {
            const selected = iconSelect.options[iconSelect.selectedIndex];
            const icon = selected.value;
            const color = selected.dataset.color;
            iconPreview.innerHTML = `<i class="fab ${icon}" style="color:${color}"></i>`;
        }

        // بارکردنی لینکەکان
        function loadLinks() {
            const links = JSON.parse(localStorage.getItem('customSocialLinks') || '[]');
            
            if (links.length === 0) {
                linkList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox" style="font-size:48px; margin-bottom:15px; display:block;"></i>
                        هیچ لینکێک زیاد نەکراوە
                    </div>
                `;
                return;
            }

            linkList.innerHTML = links.map((link, index) => `
                <div class="link-item">
                    <i class="fab ${link.icon}" style="color: ${link.color}"></i>
                    <div class="link-info">
                        <div class="name">${link.name}</div>
                        <div class="url">${link.url}</div>
                    </div>
                    <button class="btn btn-danger" onclick="deleteLink(${index})">
                        <i class="fas fa-trash"></i> سڕینەوە
                    </button>
                </div>
            `).join('');
        }

        // زیادکردنی لینکی نوێ
        addLinkForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('linkName').value;
            const url = document.getElementById('linkUrl').value;
            const icon = document.getElementById('linkIcon').value;
            const color = document.getElementById('linkColor').value;

            const links = JSON.parse(localStorage.getItem('customSocialLinks') || '[]');
            links.push({ name, url, icon, color });
            localStorage.setItem('customSocialLinks', JSON.stringify(links));

            showAlert(`"${name}" بە سەرکەوتوویی زیاد کرا!`);
            addLinkForm.reset();
            document.getElementById('linkColor').value = '#48dbfb';
            loadLinks();
        });

        // سڕینەوەی لینک
        function deleteLink(index) {
            if (!confirm('دڵنیایت لە سڕینەوەی ئەم لینکە؟')) return;
            
            const links = JSON.parse(localStorage.getItem('customSocialLinks') || '[]');
            const deleted = links.splice(index, 1)[0];
            localStorage.setItem('customSocialLinks', JSON.stringify(links));
            
            showAlert(`"${deleted.name}" سڕایەوە!`);
            loadLinks();
        }

        function showAlert(message) {
            alertBox.textContent = message;
            alertBox.style.display = 'block';
            setTimeout(() => { alertBox.style.display = 'none'; }, 3000);
        }

        // بارکردنی سەرەتایی
        checkSession();
    </script>
</body>
</html>
